<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новости c jQuery</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .news-item { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #ccc; }
        .news-title { font-weight: bold; }
        #time, #totalTime { margin-top: 10px; font-style: italic; }
    </style>
    <script src="jquery-3.7.1.min.js"></script>
</head>
<body>
    <h1>Новости (JSON, c jQuery)</h1>
    <div id="news"></div>
    <div id="time"></div>
    <div id="totalTime"></div>

    <script>
        var pageStart = performance.now();

        $(window).on("load", function () {
            var dataStart = performance.now();

            $.get("rss_200.json")
                .done(function (data) {
                    if (typeof data === "string") {
                        try {
                            data = JSON.parse(data);
                        } catch (e) {
                            $("#news").text("Ошибка разбора JSON");
                            finish();
                            return;
                        }
                    }

                    renderJSON(data);
                    finish();
                })
                .fail(function (jqXHR) {
                    $("#news").text("Ошибка загрузки JSON: " + jqXHR.status);
                    finish();
                });

            function finish() {
                var end = performance.now();
                var total = (end - pageStart).toFixed(2);
                var dataOnly = (end - dataStart).toFixed(2);

                $("#totalTime").text(
                    "Общее время от загрузки страницы до конца вывода: " + total + " мс"
                );
                $("#time").text(
                    "Время обработки и вывода данных: " + dataOnly + " мс"
                );
            }
        });

        function renderJSON(data) {
            var $container = $("#news");
            $container.empty();

            var channel = data.rss && data.rss.channel ? data.rss.channel : null;
            if (!channel || !channel.item) {
                $container.text("Некорректный формат JSON");
                return;
            }

            var items;
            if ($.isArray(channel.item)) {
                items = channel.item;
            } else {
                items = [channel.item];
            }

            for (var i = 0; i < items.length; i++) {
                var item = items[i];

                var title = item.title || "";
                var desc  = item.description || "";

                if (typeof title === "title" && title.text) title = title.text;
                if (typeof desc  === "description" && desc.text)  desc  = desc.text;

                var $div = $("<div>").addClass("news-item");
                var $h3  = $("<div>").addClass("news-title").text(title);
                var $p   = $("<div>").addClass("news-text").text(desc);

                $div.append($h3).append($p);
                $container.append($div);
            }
        }
    </script>
</body>
</html>
